# 작업 세션 부모 프로필 — 계획 준수 감독·조율·리뷰 직접 수행
# 사용법: codex --profile work
#
# 모델: gpt-6.1-sol (priority 1, "Latest workhorse model for coding and everyday work")
#   Claude 의 Opus 5 작업 세션에 대응한다.
#
# 이 프로필의 부모가 하는 일:
#   - 계획 문서를 근거로 작업을 지휘한다
#   - 리뷰를 직접 수행한다 (하위에 위임하지 않는다 — 부모가 맥락 우위를 갖고,
#     리뷰는 원문을 봐야 판단이 성립한다. 요약된 diff 로 하는 리뷰는 리뷰가 아니다)
#   - 무단 커밋·머지 검출을 직접 한다
#   - 무거운 조사는 `codex exec --profile research` 로,
#     코드 작업은 `codex exec --profile build` 로 위임해
#     원문이 이 세션 컨텍스트에 쌓이지 않게 한다
#
# 계획 이탈 금지:
#   구조·인터페이스·범위에 영향을 주는 판단이 필요해지면
#   임의로 결정하지 말고 멈추고 사용자에게 보고한다.
#   사안이 크면 `--profile plan` 세션으로 되돌아가 계획을 갱신한 뒤 재개한다.
#   작은 판단(변수명, 오류 메시지 문구)은 부모가 처리한다.
#
# 첫 쓰기 전에 브랜치를 확인한다. main 이면 즉시 알리고 수정하지 않는다.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 1
