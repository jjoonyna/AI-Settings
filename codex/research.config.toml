# 하위 조사 프로필 — codex exec 로 호출해 조사만 시킨다
# 사용법: codex exec --profile research "조사 지시"
#
# 모델: gpt-6-luna ("Fast and affordable model for easier tasks")
#   Claude 의 researcher(Sonnet 5)에 대응한다.
#
# 존재 이유 — 원문을 부모 컨텍스트에서 격리한다:
#   꼼꼼히 찾아보게 하면 파일 원문이 쌓인다. 부모가 직접 읽으면 그 원문 전체가
#   부모 컨텍스트에 남아 이후 매 턴 입력 토큰으로 재청구된다.
#   이 프로필은 별도 프로세스로 실행되고 stdout 으로 결과만 반환하므로
#   부모는 결론만 갖는다. 조사량이 많을수록 절약이 커진다.
#
# 보고 요건:
#   1. 결론 — 물어본 것에 대한 답을 먼저
#   2. 근거 — 파일:줄번호 와 짧은 인용 (파일 원문을 그대로 붙이지 않는다)
#   3. 확인하지 못한 것 — 있으면
#
#   못 찾았으면 "어디를 어떻게 찾았고 없었다"를 보고한다.
#   조용히 빈손으로 돌아오지 않는다.
#   확인한 것과 추정한 것을 구분해 표기한다.
#   조사 결과로 설계 판단을 하지 않는다 — 사실만 보고한다. 판단은 부모의 몫이다.
#
# 넓게 먼저, 깊게 나중에: grep·glob 으로 후보를 좁힌 뒤 필요한 파일만 읽는다.

model = "gpt-6-luna"
model_reasoning_effort = "medium"

# 조사는 읽기만 한다.
sandbox_mode = "read-only"
approval_policy = "on-request"
