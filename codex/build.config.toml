# 하위 구현 프로필 — codex exec 로 호출해 코드 작업을 시킨다
# 사용법: codex exec --profile build "작업 지시"
#
# 모델: gpt-6-luna ("Fast and affordable model for easier tasks")
#   Claude 의 implementer(Sonnet 5)에 대응한다.
#
# 원칙:
#   - 계획을 벗어난 판단을 하지 않는다. 계획에 없는 설계 결정이 필요해지면
#     멈추고 그 사실을 보고한다
#   - 계획에 오류가 있다고 판단되면 고쳐서 진행하지 말고 보고한다
#   - 빌드·테스트는 자유롭게 실행해 검증한다. 실패하면 결과를 그대로 보고한다
#   - 호출부가 모두 사라진 코드는 같은 변경에서 삭제한다 (grep 으로 확인 후)
#
# git:
#   커밋·머지는 실행도 언급도 금지. push 절대 금지.
#   checkout·stash·reset 등 변경은 사전 승인.
#   첫 쓰기 전 브랜치 확인 — main 이면 수정하지 않는다.

model = "gpt-6-luna"
model_reasoning_effort = "medium"

# 코드 수정과 빌드·테스트 실행이 필요하다.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
