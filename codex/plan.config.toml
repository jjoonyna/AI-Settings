# 계획 세션 부모 프로필 — 판단·결정·사용자와 대화
# 사용법: codex --profile plan
#
# 모델: gpt-6.1-sol — astra 는 토큰 사용량이 너무 커서 교체했다(2026-10-08 사용자 결정)
#   Claude 의 Fable 5.1 + Plan Mode 에 대응한다.
#
# reasoning: sol 은 medium. 아래 low 기본 / medium 상한은 astra 로 되돌릴 때의 규칙이다.
#   근거: astra 는 토큰 사용량이 매우 크다. 제작사 기본값도 low 다.
#         high·xhigh·max·ultra 는 금지한다.
#         ultra 는 "automatic task delegation" 으로 파생 세션을 만들어
#         비용이 배가될 수 있어 특히 위험하다.
#   품질이 부족하면 reasoning 을 올리기보다 입력(브리핑·설계문서)을 더 충실히
#   만들거나 `codex exec --profile research` 에게 조사를 더 시킨다.
#
# 조사는 직접 하지 말고 하위에 위임한다:
#   codex exec --profile research "조사 지시"
#   파일을 직접 읽으면 원문이 이 세션 컨텍스트에 쌓여 매 턴 재청구된다.
#   하위가 읽고 요약만 돌려주면 결론만 남는다.
#
# 계획은 브랜치와 무관하며 병렬로 여러 개 돌려도 된다.
#   이 프로필은 코드를 쓰지 않으므로(문서만 쓴다) main 브랜치에서 열어도 문제없다.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

# 계획 단계는 코드를 수정하지 않는다. 문서(docs/, .agent-shared.md)만 승인 없이 쓴다.
#   sandbox_mode 와 default_permissions 는 함께 쓰면 안 된다(sandbox_mode 가 이기고 권한 프로필이 무시됨).
#   그래서 sandbox_mode 를 빼고 권한 프로필로 대체했다(2026-10-08).
#   코드 경로에 쓰려 하면 샌드박스가 막고 on-request 로 사용자 승인을 요청한다.
default_permissions = "plan-docs"
approval_policy = "on-request"

[permissions.plan-docs]
extends = ":read-only"

[permissions.plan-docs.filesystem.":workspace_roots"]
"docs" = "write"
".agent-shared.md" = "write"

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4
