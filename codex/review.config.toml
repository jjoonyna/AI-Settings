# 분할 검수 프로필 — 큰 변경을 영역별로 나눠 검수할 때만 쓴다
# 사용법: codex --profile review
#
# 모델: gpt-6.1-sol (priority 1, "Latest workhorse model for coding and everyday work")
#   ultra reasoning 을 지원하는 상위 등급이며 기본 reasoning 이 medium 이다.
#   gpt-reserve 는 visibility=hide 인 폴백 모델이라 제외했다.
#
# 기본 리뷰는 이 프로필이 아니라 --profile work 의 부모가 직접 한다.
#   같은 모델이어도 부모가 맥락 우위를 갖고, 리뷰는 원문을 봐야 판단이 성립한다.
#   요약된 diff 로 하는 리뷰는 리뷰가 아니다.
# 이 프로필은 변경 규모가 매우 커서 부모가 전체 diff 를 읽으면 컨텍스트가
#   넘칠 때, 영역별로 나눠 검수하고 부모가 종합 판단하는 용도다.
#   맡은 영역에 집중하고 그 밖을 추측으로 평가하지 않는다.
# 무단 커밋·머지 검출은 항상 부모가 직접 한다.
#
# 검수 항목: 요구사항 충족 / 기능 보존(통합 시 양쪽 모두 살아있는가) /
#            미사용 코드 잔존 / 문서 동기화
# 보고: 무엇이·어디서(파일:줄번호)·왜 문제인지·어떻게 고쳐야 하는지.
#       "문제 없습니다"만 쓰지 않고 무엇을 확인했는지 밝힌다.

model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

# 검수는 수정하지 않는다.
sandbox_mode = "read-only"
approval_policy = "on-request"
